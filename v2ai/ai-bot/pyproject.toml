[tool.poetry]
name = "ai-bot"
version = "0.1.0"
description = "Pipecat voice AI pipeline: STT to LLM to TTS"
authors = ["vidya <k.vidya@samvyo.com>"]
package-mode = false  

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
anthropic = "^0.39.0"
python-dotenv = "^1.0.0"
pyaudio = "^0.2.14"
loguru = "^0.7.2"
aiohttp = "^3.9.0"
deepgram-sdk = ">=3.0.0,<4.0.0"
opuslib = "^3.0.1"
# Audio resampling for the RTP send/receive paths. Replaces the stdlib
# `audioop`, which was removed in Python 3.13.
soxr = "^1.0.0"
numpy = "^2.0.0"
httpx = "0.27.2"
torch = ">=2.0.0,<3.0.0"
av = "^17.1.0"
Pillow = "10.4.0"
spacy = "^3.8.14"
opentelemetry-api = "1.24.0"
opentelemetry-sdk = "1.24.0"
opentelemetry-exporter-otlp-proto-grpc = "1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.0.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

